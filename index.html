<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COCO - คู่มือประกอบอาหาร</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-dark: #6B3F24;  /* Midnight Slate */
            --accent-gold: #F5B324;   /* Rich Gold */
            --success-emerald: #059669;
            --bg-light: #F8FAFC;      /* Off-White นวลตา */
            --card-inner: #FAFAF9;    /* Soft Cream */
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0; padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }

        /* 🔒 UI หน้าจอระบบล็อกรหัสผ่าน (Login Screen) */
        #loginBlock {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--primary-dark);
            padding: 20px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
        }
        .login-box {
            background: #FFFFFF; color: var(--primary-dark); padding: 35px 25px;
            border-radius: 24px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .login-input {
            width: 100%; padding: 14px; border: 2px solid #E2E8F0; border-radius: 12px;
            font-size: 18px; font-weight: 700; text-align: center; outline: none;
            margin-top: 15px; margin-bottom: 15px; letter-spacing: 2px; transition: border-color 0.2s;
        }
        .login-input:focus { border-color: var(--accent-gold); }
        .login-btn {
            width: 100%; background: var(--primary-dark); color: white; border: none;
            padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-btn:active { opacity: 0.9; }

        /* 📌 Header ดีไซน์คงที่ (Sticky) */
        .header-sticky {
            position: sticky; top: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            padding: 14px 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
            border-bottom: 1px solid #E2E8F0;
            z-index: 100;
        }

        /* ปุ่มสลับโหมด 2 ปุ่มแบ่งครึ่งหน้าจอสมมาตรสวยงาม */
        .mode-switcher {
            display: flex; background: #F1F5F9; padding: 4px; border-radius: 14px; margin-bottom: 12px; gap: 4px;
        }
        .mode-btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s ease;
            text-align: center;
        }
        .mode-btn.active {
            background: #FFFFFF; color: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
        }

        /* ส่วนเครื่องมือค้นหา */
        .search-wrapper { position: relative; margin-bottom: 10px; }
        .search-bar {
            width: 100%; padding: 14px 45px 14px 16px; border: 1px solid #E2E8F0;
            border-radius: 12px; font-size: 16px; font-weight: 600; outline: none; background-color: #FFFFFF;
            color: var(--text-main);
        }
        .search-bar:focus { border-color: var(--primary-dark); }
        .search-clear {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: #E2E8F0; color: #475569; border: none; border-radius: 50%;
            width: 24px; height: 24px; font-size: 12px; display: none; align-items: center; justify-content: center; font-weight: bold; cursor: pointer;
        }

        .filter-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: #FFFFFF; color: var(--text-muted); border: 1px solid #E2E8F0;
            padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .filter-btn.active { background: var(--primary-dark); color: #FFFFFF; border-color: var(--primary-dark); }

        /* -------------------------------------
            📜 UI หน้าข้อมูลพื้นฐานร้าน
        ------------------------------------- */
        #manualView { display: none; padding-bottom: 60px; }
        .manual-card { background: white; border-radius: 16px; padding: 22px 18px; margin-bottom: 16px; border: 1px solid #E2E8F0; box-shadow: 0 4px 15px rgba(0,0,0,0.01); }
        .manual-title { font-size: 19px; font-weight: 800; color: var(--primary-dark); margin-top: 0; margin-bottom: 14px; border-left: 4px solid var(--accent-gold); padding-left: 10px; }
        .manual-text { font-size: 16px; color: #334155; line-height: 1.7; }
        
        .manual-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
        .manual-table th { background: #F8FAFC; color: var(--primary-dark); font-weight: 700; text-align: left; padding: 10px; border-bottom: 2px solid #E2E8F0; }
        .manual-table td { padding: 10px; border-bottom: 1px solid #F1F5F9; color: #334155; font-weight: 500; }
        
        .script-box { background: var(--card-inner); border-radius: 10px; padding: 12px 14px; border: 1px solid #E7E5E4; margin-top: 10px; }
        .script-q { font-weight: 700; color: var(--accent-gold); font-size: 15px; }
        .script-a { font-weight: 500; color: #1E293B; margin-top: 2px; font-size: 15px; }

        /* -------------------------------------
            🍳 UI การ์ดสูตรอาหาร
        ------------------------------------- */
        #recipeView { padding-bottom: 80px; }
        .menu-grid { display: flex; flex-direction: column; gap: 16px; }
        .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02); border: 1px solid #E2E8F0; overflow: hidden; }
        .card-header { padding: 16px 16px 10px 16px; }
        .card-title { font-size: 22px; font-weight: 800; color: var(--primary-dark); margin: 0; }
        .card-indicators { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px 16px; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid transparent; }
        .bg-teppan { background: #F0FDF4; color: #166534; border-color: #DCFCE7; }
        .bg-pan { background: #F8FAFC; color: #334155; border-color: #E2E8F0; }
        .bg-oil { background: #FFFBEB; color: #92400E; border-color: #FEF3C7; }
        .bg-butter { background: #FFF7ED; color: #9A3412; border-color: #FFEDD5; }
        .bg-cut { background: #FFF1F2; color: #9F1239; border-color: #FFE4E6; width: 100%; margin-top: 2px; }
        .method-text { font-size: 18px; line-height: 1.7; color: #0F172A; font-weight: 500; background: var(--card-inner); padding: 16px; border-top: 1px solid #F1F5F9; white-space: pre-line; }
        .card-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 8px 16px; background: #FFFFFF; border-top: 1px dashed #E2E8F0; }
        .btn-text-edit, .btn-text-delete { background: none; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-text-edit { color: #3b82f6; } .btn-text-delete { color: #ef4444; }

        .fab-add { position: fixed; bottom: 20px; right: 20px; background: var(--primary-dark); color: white; border: none; width: 56px; height: 56px; border-radius: 28px; font-size: 24px; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2); z-index: 100; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: white; width: 100%; max-width: 600px; max-height: 85vh; padding: 20px; border-radius: 22px 22px 0 0; overflow-y: auto; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 14px; color: var(--primary-dark); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 10px; font-size: 15px; outline: none; background: #F8FAFC; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { flex: 1; background: #F1F5F9; color: var(--text-main); border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-save { flex: 2; background: var(--primary-dark); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginBlock">
    <div class="login-box">
        <h2 style="margin: 0; font-weight: 800; font-size: 24px; color: var(--primary-dark);">🔒 COCO SYSTEM</h2>
        <p style="font-size: 14px; color: var(--text-muted); margin: 5px 0 20px 0;">เฉพาะพนักงานร้าน COCO เท่านั้น</p>
        <input type="password" id="passInput" class="login-input" placeholder="รหัสผ่าน" onkeyup="if(event.key === 'Enter') verifyPassword()">
        <button class="login-btn" onclick="verifyPassword()">เข้าสู่ระบบคู่มือ</button>
        <p id="loginError" style="color: #ef4444; font-size: 14px; font-weight: 700; margin-top: 12px; display: none;">❌ รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง</p>
    </div>
</div>

<div id="appBlock" style="display: none;">
    <div class="header-sticky">
        <div class="container" style="padding: 0;">
            <div class="mode-switcher">
                <button class="mode-btn active" id="btn-recipe-mode" onclick="switchMode('recipe')">📖 คู่มือสูตรอาหาร</button>
                <button class="mode-btn" id="btn-manual-mode" onclick="switchMode('manual')">📜 ข้อมูลพื้นฐาน</button>
            </div>

            <div id="recipeTools">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ค้นหาสูตร หรือวิธีทำ..." onkeyup="handleSearchKeyUp()">
                    <button id="clearSearchBtn" class="search-clear" onclick="clearSearch()">✕</button>
                </div>
                <div class="filter-scroll">
                    <button class="filter-btn active" id="filter-all" onclick="setQuickFilter('all')">ทั้งหมด</button>
                    <button class="filter-btn" id="filter-teppan" onclick="setQuickFilter('panType', 'teppan')">🍳 เตาเทปัน</button>
                    <button class="filter-btn" id="filter-small-pan" onclick="setQuickFilter('panType', 'small-pan')">🥘 กระทะเล็ก</button>
                    <button class="filter-btn" id="filter-oil" onclick="setQuickFilter('fatType', 'oil')">🛢️ น้ำมัน</button>
                    <button class="filter-btn" id="filter-butter" onclick="setQuickFilter('fatType', 'butter-solid')">🧈 เนย</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div id="recipeView">
            <div class="menu-grid" id="menuGrid">
                <p style="text-align: center; color: var(--text-muted); font-size: 16px; margin-top: 40px;">⏳ กำลังเรียกคืนข้อมูลสูตรอาหาร...</p>
            </div>
            <button class="fab-add" id="fabAddBtn" onclick="openModal()">+</button>
        </div>

        <div id="manualView" style="display: none;">
            </div>
    </div>
</div>

<div class="modal" id="menuModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-top:0; font-size:18px; font-weight:800;">📝 บันทึกข้อมูล</h2>
        <form id="menuForm">
            <input type="hidden" id="editMenuId">
            <div class="form-group"><label>ชื่อเมนูอาหาร</label><input type="text" id="menuName" required></div>
            <div class="form-group">
                <label>การเลือกไขมันพื้นฐาน</label>
                <select id="fatType">
                    <option value="none">- ไม่ระบุไขมัน -</option>
                    <option value="oil">🛢️ น้ำมัน</option>
                    <option value="butter">🧈 เนยก้อน</option>
                    <option value="Melted butter">🧈 เนยละลาย</option>
                </select>
            </div>
            <div class="form-group">
                <label>กระทะที่ใช้</label>
                <select id="panType">
                    <option value="none">- ไม่ระบุกระทะ -</option>
                    <option value="teppan">🍳 เตาเทปัน</option>
                    <option value="small-pan">🥘 กระทะเล็ก</option>
                    <option value="both">🍳 เตาเทปัน + 🥘 กระทะเล็ก</option>
                </select>
            </div>
            <div class="form-group"><label>การหั่น</label><input type="text" id="cutMethod" placeholder="เช่น หั่น 4 ครั้ง ได้ 5 ชิ้น"></div>
            <div class="form-group"><label>ขั้นตอนวิธีทำและสัดส่วนส่วนผสม</label><textarea id="instructions" rows="5" required></textarea></div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">ปิด</button>
                <button type="button" id="btnSaveSubmit" class="btn-save" onclick="saveMenu()">บันทึกข้อมูลสูตร</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ⚙️ FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyAkLEk_ihyEpqcunK1pVZ1O7L5GCMU2WbU",
        authDomain: "coco-menu-7c395.firebaseapp.com",
        databaseURL: "https://coco-menu-7c395-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "coco-menu-7c395",
        storageBucket: "coco-menu-7c395.firebasestorage.app",
        messagingSenderId: "690988825597",
        appId: "1:690988825597:web:eab946a1304eb0ab113794"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const menuRef = database.ref('restaurant_menus');

    let globalMenus = [];
    let currentFilter = { field: 'all', value: null };

    // เก็บ Raw HTML ของข้อมูลร้านไว้ในตัวแปร ไม่ให้โผล่ไปที่แท็ก HTML ตั้งแต่แรกเพื่อความปลอดภัย
    const manualContentHTML = `
        <div class="manual-card">
            <div class="manual-title">📢 MOTTO </div>
            <div class="manual-text">
                พื้นฐานความสำเร็จในการบริการ:
                <ul>
                    <li><strong>NIKONIKO :</strong>(รอยยิ้ม)</li>
                    <li><strong>KIBIKIBI :</strong>(ความกระตือรือร้น)</li>
                    <li><strong>HAKIHAKI :</strong>(การพูดชัดเจนด้วยถ้อยคำสุภาพอ่อนน้อม)</li>
                </ul>
            </div>
        </div>

        <div class="manual-card">
            <div class="manual-title">⚖️ ปริมาณการชั่งข้าว/ซอสแกง</div>
            <div class="manual-text">
                ปริมาณ ข้าว/ปริมาณ ซอส:
                <table class="manual-table">
                    <thead>
                        <tr><th>ไซส์ข้าว</th><th>น้ำหนักมาตรฐาน</th><th>น้ำหนักซอส (S)</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><strong>ข้าวนิ (N)</strong></td><td>150 กรัม</td><td>132 กรัม</td></tr>
                        <tr><td><strong>ข้าวซัง (S)</strong></td><td>230 กรัม</td><td>190 กรัม</td></tr>
                        <tr><td><strong>ข้าวย้ง (Y)</strong></td><td>350 กรัม</td><td>260 กรัม</td></tr>
                        <tr><td><strong>ข้าวโกะ (K)</strong></td><td>450 กรัม</td><td>330 กรัม</td></tr>
                        <tr><td><strong>ข้าวโระ (R)</strong></td><td>550 กรัม</td><td>400 กรัม</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="manual-card">
            <div class="manual-title">🥩 ส่วนของเนื้อสัตว์</div>
            <div class="manual-text">
                ส่วนต่างๆของวัตถุดิบ:
                <ul>
                    <li><strong>หมูทอด:</strong> 🍽จะเป็นส่วน <strong>"สันนอก"</strong></li>
                    <li><strong>หมูคุโรบุตะ:</strong> 🍽จะเป็นส่วน <strong>"สันคอ"</strong></li>
                    <li><strong>ไก่:</strong> 🍽จะเป็นส่วน <strong>"สะโพกไก่"</strong></li>
                    <li><strong>เนื้อลูกเต๋า:</strong> 🍽จะเป็นส่วน <strong>"สันใน"</strong></li>
                    <li><strong>เนื้อสไลด์:</strong> 🍽จะเป็นส่วน <strong>"สันคอ"</strong></li>
                    <li><strong>เกี๊ยวซ่า:</strong> 🍽ใส้ <strong>"ไก่"</strong></li>
                </ul>
            </div>
        </div>

        <div class="manual-card">
            <div class="manual-title">🍚 ข้อมูล ข้าว ตรา ฟูจิฮิคาริ</div>
            <div class="manual-text">
                อันนี้ออกสอบแน่พี่น้องเอ้ย :
                <div class="script-box">
                    <div class="script-q"> 🍚 ข้าว ตรา ฟูจิฮิคาริ : "สายพันธุ์ ซาซานิชิกิ/Sasanishiki ปลูกที่เชียงราย"</div>
                </div>
            </div>
        </div>
    `;

    // 🔒 ฟังก์ชันตรวจสอบสิทธิ์และควบคุมหน้ากากความปลอดภัย
    function checkAuth() {
        if (localStorage.getItem('coco_authenticated') === 'true') {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('appBlock').style.display = 'block';
            
            // ปลดล็อกข้อมูลพื้นฐานร้านเขียนลง HTML เมื่อล็อกอินผ่านจริงเท่านั้น
            document.getElementById('manualView').innerHTML = manualContentHTML;
            
            // เริ่มต้นเชื่อมต่อ Firebase ยืนยันตัวตนผ่านแล้วเท่านั้น
            startFirebaseListener();
        } else {
            document.getElementById('loginBlock').style.display = 'flex';
            document.getElementById('appBlock').style.display = 'none';
            document.getElementById('manualView').innerHTML = ''; // เคลียร์ทิ้งกรณีไม่ได้ล็อกอิน
        }
    }

    function verifyPassword() {
        const inputPass = document.getElementById('passInput').value;
        if (inputPass === 'T50') {
            localStorage.setItem('coco_authenticated', 'true');
            checkAuth();
        } else {
            const errorTxt = document.getElementById('loginError');
            errorTxt.style.display = 'block';
            document.getElementById('passInput').value = '';
            setTimeout(() => { errorTxt.style.display = 'none'; }, 2500);
        }
    }

    // รันกระบวนการตรวจสิทธิ์ทันทีเมื่อโครงสร้างเว็บโหลดเสร็จสิ้น
    window.addEventListener('DOMContentLoaded', checkAuth);

    function loadCachedData() {
        // ดึง Cache ได้ก็ต่อเมื่อล็อกอินแล้วเท่านั้น
        if (localStorage.getItem('coco_authenticated') !== 'true') return;
        try {
            const cached = localStorage.getItem('coco_menus_cache');
            if (cached) { globalMenus = JSON.parse(cached); renderMenus(); }
        } catch (e) { console.error(e); }
    }

    // แยกกลุ่มการดึงข้อมูล Firebase ออกมาทำงานเฉพาะคนปลดล็อกแล้วเท่านั้น
    function startFirebaseListener() {
        loadCachedData();

        menuRef.on('value', (snapshot) => {
            try {
                // เช็กซ้ำอีกรอบเพื่อความปลอดภัยสูงสุด
                if (localStorage.getItem('coco_authenticated') !== 'true') {
                    menuRef.off(); // สั่งปิดการเชื่อมต่อทันที
                    return;
                }
                const data = snapshot.val();
                globalMenus = [];
                if (data) {
                    Object.keys(data).forEach(key => { if (data[key]) globalMenus.push({ id: key, ...data[key] }); });
                    localStorage.setItem('coco_menus_cache', JSON.stringify(globalMenus));
                }
                renderMenus();
            } catch (err) { loadCachedData(); }
        }, (error) => { loadCachedData(); });
    }

    // 🔄 ควบคุมการสลับหน้าจอ 2 โหมดแบบไร้รอยต่อ
    function switchMode(mode) {
        if (localStorage.getItem('coco_authenticated') !== 'true') return; // บล็อกถ้ายังไม่ล็อกอิน
        
        document.getElementById('btn-recipe-mode').classList.remove('active');
        document.getElementById('btn-manual-mode').classList.remove('active');
        
        document.getElementById('recipeView').style.display = 'none';
        document.getElementById('manualView').style.display = 'none';
        document.getElementById('recipeTools').style.display = 'none';

        if (mode === 'recipe') {
            document.getElementById('btn-recipe-mode').classList.add('active');
            document.getElementById('recipeView').style.display = 'block';
            document.getElementById('recipeTools').style.display = 'block';
        } else if (mode === 'manual') {
            document.getElementById('btn-manual-mode').classList.add('active');
            document.getElementById('manualView').style.display = 'block';
        }
    }

    function renderMenus() {
        const grid = document.getElementById('menuGrid');
        if (!grid) return;
        
        // ถ้าไม่ผ่านการยืนยันตัวตน ไม่เรนเดอร์ข้อมูลใดๆ ทั้งสิ้น
        if (localStorage.getItem('coco_authenticated') !== 'true') {
            grid.innerHTML = '<p style="text-align:center; font-size:15px; color:var(--text-muted); margin-top:30px;">🔒 กรุณาเข้าสู่ระบบก่อนใช้งาน</p>';
            return;
        }

        const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
        grid.innerHTML = '';

        const filteredMenus = globalMenus.filter(menu => {
            if (!menu || !menu.name) return false;
            if (currentFilter.field === 'panType' && menu.panType !== currentFilter.value) {
                if (!(currentFilter.value === 'teppan' && menu.panType === 'both')) return false;
            }
            if (currentFilter.field === 'fatType' && menu.fatType !== currentFilter.value) return false;
            return (menu.name || '').toLowerCase().includes(searchTerm) || (menu.instructions || '').toLowerCase().includes(searchTerm);
        });

        if (filteredMenus.length === 0) {
            grid.innerHTML = '<p style="text-align:center; font-size:15px; color:var(--text-muted); margin-top:30px;">❌ ไม่พบรายการสูตรอาหาร</p>';
            return;
        }

        filteredMenus.forEach(menu => {
            const safeName = menu.name || 'ไม่ระบุชื่อ';
            const safeInstructions = (menu.instructions || '').replace(/-/g, '•');
            const cutHtml = menu.cutMethod ? `<div class="badge bg-cut">🔪 การตัดแต่ง: ${menu.cutMethod}</div>` : '';
            let fatBadge = menu.fatType === 'oil' ? '<span class="badge bg-oil">🛢️ น้ำมัน</span>' : (menu.fatType !== 'none' && menu.fatType ? '<span class="badge bg-butter">🧈 เนย</span>' : '');
            let panBadge = menu.panType === 'teppan' ? '<span class="badge bg-teppan">🍳 เตาเทปัน</span>' : (menu.panType === 'small-pan' ? '<span class="badge bg-pan">🥘 กระทะเล็ก</span>' : (menu.panType === 'both' ? '<span class="badge bg-teppan">🍳 เตาเทปัน</span> <span class="badge bg-pan">🥘 แยกกระทะ</span>' : ''));

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header"><h3 class="card-title">${safeName}</h3></div>
                <div class="card-indicators">${fatBadge}${panBadge}${cutHtml}</div>
                <div class="method-text">${safeInstructions}</div>
                <div class="card-footer">
                    <button class="btn-text-edit" onclick="editMenu('${menu.id}')">✏️ แก้ไข</button>
                    <button class="btn-text-delete" onclick="deleteMenu('${menu.id}')">🗑️ ลบ</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function handleSearchKeyUp() {
        const val = document.getElementById('searchInput').value;
        document.getElementById('clearSearchBtn').style.display = val ? 'flex' : 'none';
        renderMenus();
    }
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearchBtn').style.display = 'none';
        renderMenus();
    }
    function setQuickFilter(field, value = null) {
        currentFilter.field = field; currentFilter.value = value;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (field === 'all') document.getElementById('filter-all').classList.add('active');
        else if (field === 'panType') document.getElementById(`filter-${value}`).classList.add('active');
        else if (field === 'fatType') document.getElementById('filter-oil').classList.add('active');
        renderMenus();
    }
    function openModal(isEdit = false) { 
        if (localStorage.getItem('coco_authenticated') !== 'true') return;
        document.getElementById('menuModal').style.display = 'flex'; 
        if (!isEdit) { document.getElementById('menuForm').reset(); document.getElementById('editMenuId').value = ''; document.getElementById('modalTitle').innerText = '📝 เพิ่มสูตรอาหารใหม่'; }
    }
    function closeModal() { document.getElementById('menuModal').style.display = 'none'; }
    function editMenu(firebaseId) {
        if (localStorage.getItem('coco_authenticated') !== 'true') return;
        const menu = globalMenus.find(m => m.id === firebaseId);
        if (!menu) return;
        document.getElementById('editMenuId').value = menu.id;
        document.getElementById('menuName').value = menu.name || '';
        document.getElementById('fatType').value = menu.fatType || 'none';
        document.getElementById('panType').value = menu.panType || 'none';
        document.getElementById('cutMethod').value = menu.cutMethod || '';
        document.getElementById('instructions').value = menu.instructions || '';
        document.getElementById('modalTitle').innerText = '✏️ แก้ไขสูตร';
        openModal(true);
    }
    function saveMenu() {
        if (localStorage.getItem('coco_authenticated') !== 'true') return alert("ไม่มีสิทธิ์เข้าถึง");
        const id = document.getElementById('editMenuId').value;
        const name = document.getElementById('menuName').value.trim();
        const fatType = document.getElementById('fatType').value;
        const panType = document.getElementById('panType').value;
        const cutMethod = document.getElementById('cutMethod').value.trim();
        const instructions = document.getElementById('instructions').value.trim();
        if (!name || !instructions) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        const menuData = { name, fatType, panType, cutMethod, instructions };
        if (id) menuRef.child(id).update(menuData).then(() => closeModal());
        else menuRef.push(menuData).then(() => closeModal());
    }
    function deleteMenu(firebaseId) { 
        if (localStorage.getItem('coco_authenticated') !== 'true') return alert("ไม่มีสิทธิ์เข้าถึง");
        if (confirm("ต้องการลบสูตรอาหารนี้ใช่ไหม?")) menuRef.child(firebaseId).remove(); 
    }
</script>
</body>
</html>
